[client]
showErrorDetails = true
toolbarMode = "viewer"

[logger]
level = "warning"

[theme]
primaryColor = "#0066cc"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[server]
maxUploadSize = 200
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
