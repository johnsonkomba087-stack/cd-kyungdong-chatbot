services:
  - type: web
    name: cd-kyungdong-chatbot
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: bash run.sh
    envVars:
      - key: STREAMLIT_SECRETS_GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STREAMLIT_SECRETS_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HYBRID_RETRIEVAL_ENABLED
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.4
