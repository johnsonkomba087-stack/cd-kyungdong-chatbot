services:
  - type: web
    name: kdu-global-chatbot
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: STREAMLIT_SECRETS_GROQ_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STREAMLIT_SECRETS_ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: HYBRID_RETRIEVAL_ENABLED
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PIP_NO_CACHE_DIR
        value: "false"
      - key: PIP_DEFAULT_TIMEOUT
        value: "120"
      - key: STREAMLIT_CLIENT_SHOW_ERROR_DETAILS
        value: "false"